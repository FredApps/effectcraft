name: Effect 3791 Windows model and PSD validation
on:
  push:
    branches: [validation/effect-3791-windows-efe89fb9]
permissions:
  contents: read
concurrency:
  group: effect-3791-windows-validation
  cancel-in-progress: false
jobs:
  windows:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0
    with:
      os: '["windows-latest"]'
      select-os: '[]'
      timeout-minutes: 25
      gate-timeout-minutes: 23
      tools: ""
      targets: ""
      craft-fonts-ref: ""
      require-craft-fonts: false
      command: |
        git fetch --no-tags origin efe89fb9bc499594e23858cd2073107049933a45
        git diff --exit-code efe89fb9bc499594e23858cd2073107049933a45 HEAD -- . ':(exclude).github/workflows/validate-effect-3791-windows.yml'
        cargo test -p effectcraft-model -p effectcraft-psd --locked
