name: Effect 3868 exact source Windows engine regression
on:
  push:
    branches: [validation/effect-3868-windows-engine-cc0a7f83]
permissions:
  contents: read
concurrency:
  group: effect-3868-windows-engine-cc0a7f83
  cancel-in-progress: false
jobs:
  windows:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ecb64b2acb8731f0e2eb8f55fd2f45424bef75d0
    with:
      os: '["windows-latest"]'
      select-os: '[]'
      timeout-minutes: 25
      gate-timeout-minutes: 23
      tools: ""
      targets: ""
      craft-fonts-ref: ""
      require-craft-fonts: false
      command: |
        git fetch --no-tags origin cc0a7f838a3e6c51d9dac14904a501a4092a49c7
        git diff --exit-code cc0a7f838a3e6c51d9dac14904a501a4092a49c7 HEAD -- . ':(exclude).github/workflows/validate-effect-3868-engine-windows.yml'
        cargo test -p effectcraft-engine --lib --locked -- tests::m137::watch_folder_renders_queued_projects_and_writes_status --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/effect3868-windows-tests.log"
        test "$(grep -c '^running 1 test' "$RUNNER_TEMP/effect3868-windows-tests.log")" -eq 1
        test "$(grep -c 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/effect3868-windows-tests.log")" -eq 1
